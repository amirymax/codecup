name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Новый пуш отменяет предыдущий прогон той же ветки.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codecup
          POSTGRES_USER: codecup
          POSTGRES_PASSWORD: codecup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codecup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-not-used-anywhere
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://codecup:codecup@127.0.0.1:5432/codecup

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Установить зависимости
        run: pip install -r requirements/dev.txt

      - name: Стиль
        run: |
          ruff check .
          ruff format --check .

      - name: Миграции не расходятся с моделями
        run: python manage.py makemigrations --check --dry-run

      - name: Тесты
        run: pytest -q

      - name: Схема OpenAPI собирается без предупреждений
        run: python manage.py spectacular --file /dev/null --fail-on-warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        working-directory: frontend
        run: npm ci

      - name: Стиль
        working-directory: frontend
        run: npm run lint

      - name: Типы
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Сборка
        working-directory: frontend
        run: npm run build

  schema-drift:
    name: Типы фронтенда не отстали от API
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-not-used-anywhere
      DATABASE_URL: postgres://codecup:codecup@127.0.0.1:5432/codecup

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r requirements/dev.txt

      - name: Перегенерировать схему и типы
        run: |
          python manage.py spectacular --format openapi-json \
            --file frontend/src/lib/api/openapi.json --fail-on-warn
          npx --yes openapi-typescript@7 frontend/src/lib/api/openapi.json \
            -o frontend/src/lib/api/schema.ts

      - name: Проверить, что закоммиченные типы совпадают
        run: |
          if ! git diff --quiet frontend/src/lib/api/; then
            echo "::error::Схема изменилась, а типы не пересобраны. Запустите: make schema"
            git diff --stat frontend/src/lib/api/
            exit 1
          fi
          echo "Типы актуальны."
