# Конфигурация до выпуска сертификатов.
#
# Нужна ровно для того, чтобы certbot прошёл проверку по HTTP. После
# `certbot --nginx` её заменяет codecup.conf с TLS.
server {
    listen 80;
    listen [::]:80;
    server_name codecup.tech www.codecup.tech api.codecup.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 200 "CodeCup: ожидание сертификатов\n";
        add_header Content-Type text/plain;
    }
}
