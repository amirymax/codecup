# codecup.tech      — фронтенд (Next.js на 127.0.0.1:3000)
# api.codecup.tech  — backend (gunicorn на 127.0.0.1:8000)
#
# Домены соседние: кука сессии выставлена с SameSite=Lax и доменом
# .codecup.tech, поэтому уходит на оба. Развести их на разные домены нельзя —
# вход перестанет работать.

server {
    listen 80;
    listen [::]:80;
    server_name codecup.tech www.codecup.tech api.codecup.tech;

    # Проверки Let's Encrypt должны проходить без редиректа.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 включается на listen: отдельной директивы http2 в nginx 1.24,
    # который стоит на сервере, ещё нет — с ней конфиг не проходит nginx -t.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.codecup.tech;

    ssl_certificate     /etc/letsencrypt/live/codecup.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codecup.tech/privkey.pem;

    client_max_body_size 12m;   # чеки об оплате

    # Чеки об оплате наружу не отдаются: в них номера карт и имена. Сюда
    # попадают только по внутреннему редиректу от Django, который сначала
    # проверяет, что запрос от администратора.
    location /protected-media/ {
        internal;
        alias /opt/codecup/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Без этого Django за прокси считает соединение небезопасным
        # и уходит в бесконечный редирект на https.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    # http2 включается на listen: отдельной директивы http2 в nginx 1.24,
    # который стоит на сервере, ещё нет — с ней конфиг не проходит nginx -t.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codecup.tech www.codecup.tech;

    ssl_certificate     /etc/letsencrypt/live/codecup.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codecup.tech/privkey.pem;

    location /_next/static/ {
        alias /opt/codecup/frontend/.next/static/;
        expires 1y;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
